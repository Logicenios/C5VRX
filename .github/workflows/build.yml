name: C5VRX-3 Production CI

on:
  push:
    branches: [main, "codex/**", "feat/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Architectural & DSP Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Architectural Constraints
        run: python tools/validate_build.py

  build:
    name: Build Production Firmware (ESP32-C5)
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build C5VRX-3 Firmware
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          idf.py build

      - name: Prepare Release Artifacts
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          mkdir -p release
          cp build/bootloader/bootloader.bin release/
          cp build/partition_table/partition-table.bin release/
          cp build/c5vrx3.bin release/
          cp build/flasher_args.json release/
          esptool.py --chip esp32c5 merge_bin -o release/c5vrx3_merged.bin \
            --flash_mode dio --flash_size 8MB --flash_freq 80m \
            0x2000 build/bootloader/bootloader.bin \
            0x8000 build/partition_table/partition-table.bin \
            0x10000 build/c5vrx3.bin
          cd release
          sha256sum * > SHA256SUMS

      - name: Upload Production Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: c5vrx3-production-firmware
          path: release/
          if-no-files-found: error

  release-main:
    name: Publish Continuous Main Release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Built Artifacts
        uses: actions/download-artifact@v4
        with:
          name: c5vrx3-production-firmware
          path: release/

      - name: Update Main GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload main release/* --clobber --repo Twotoz/C5VRX || \
          gh release create main release/* \
            --repo Twotoz/C5VRX \
            --title "C5VRX-3 (Latest main branch)" \
            --notes "Continuous build from main branch commit ${{ github.sha }}." \
            --target main
