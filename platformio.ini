; C5VRX PlatformIO project: one environment per board/backend (docs/BOARDS.md).
;
; Platform: pioarduino. The official platformio/espressif32 7.1.3 bundles
; ESP-IDF 6.1.0 but cannot build ESP32-C5: its platform.py installs the RISC-V
; toolchain only for C3/C6/S2/S3, so CMake finds no riscv32-esp-elf-gcc
; (docs/refactor/02-platformio.md). pioarduino ships ESP32-C5 support and
; ESP-IDF 6.1.0 with toolchain riscv32-esp-elf 15.2.0. Pinned by release URL.
;
; Build all:        pio run
; Build one board:  pio run -e waveshare_c5zero_fpga
; Flash + monitor:  pio run -e xiao_c5_dac -t upload -t monitor

[platformio]
src_dir = src
default_envs = waveshare_c5zero_fpga, xiao_c5_dac

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/61.04.00-RC1/platform-espressif32.zip
framework = espidf
board_build.partitions = partitions.csv
monitor_speed = 115200
; The firmware logs only at boot, then stays silent (realtime design). Reset
; the board with the monitor open to see the boot log; press 'd' for the
; diagnostics summary. (esp32_exception_decoder is not provided by this platform.)

; Per-env ESP-IDF config: the builder generates sdkconfig.<env> from
; sdkconfig.defaults plus the env-specific defaults file named here.
; After editing a sdkconfig.defaults.<env> file run `pio run -t fullclean -e <env>`
; (the builder only watches sdkconfig.defaults for changes).

[env:waveshare_c5zero_fpga]
board = waveshare_esp32c5_zero
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.waveshare_c5zero_fpga"

[env:xiao_c5_dac]
board = seeed_xiao_esp32c5
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.xiao_c5_dac"
